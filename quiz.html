<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lora:ital,wght@0,400;0,700;1,400;1,700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="container">
    <h1>Wesele</h1>
    <div class="ornament">❦ ❧ ❦</div>
    <h3 style="text-align: center; border: none; margin-top: -10px;">Stanisława Wyspiańskiego</h3>

    <!-- Nawigacja -->
    <nav>
        <ul>
            <li><a href="index.html">Strona Główna</a></li>

            <li><a href="quiz.html">Egzamin (Quiz)</a></li>
        </ul>

    <div class="quiz-container" id="quiz">
        <h2>Egzamin Dojrzałości</h2>
        <p style="text-align: center; font-style: italic;">Sprawdź swą wiedzę, nim zapieje kur i pryśnie czar weselnej nocy.</p>
        
        <div class="progress-container" id="progressContainer" style="display: none;">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <form id="weseleQuiz">
            <!-- Pytania beda ladowane dynamicznie z JS -->
            <div id="questionsContainer">
                <p style="text-align: center;">Trwa przygotowywanie pytań...</p>
            </div>
            
            <button type="button" id="submitBtn" style="display: none;" onclick="checkQuiz()">Zakończ test i poznaj swój los</button>
        </form>

        <div id="result"></div>
    </div>

</div>

<script src="assets/js/quiz.js"></script>
