# Automatyczna publikacja strony na zosia.fotonacja.net przez FTP.
# Uruchamia się po każdej zmianie na gałęzi main oraz ręcznie (Actions → Publikacja → Run workflow).
#
# Wymagane ustawienia repozytorium (Settings → Secrets and variables → Actions):
#   Secrets:   FTP_SERVER    – adres serwera FTP, np. ftp.fotonacja.net
#              FTP_USERNAME  – login FTP
#              FTP_PASSWORD  – hasło FTP
#   Variables (opcjonalne):
#              FTP_SERVER_DIR – katalog subdomeny na serwerze, zakończony "/", np. public_html/zosia/
#                               (domyślnie "./" – katalog, w którym ląduje się po zalogowaniu)
#              FTP_PROTOCOL   – ftps (domyślnie) | ftp | ftps-legacy
#              FTP_PORT       – domyślnie 21

name: Publikacja na zosia.fotonacja.net

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz pliki repozytorium
        uses: actions/checkout@v4

      - name: Wyślij stronę przez FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || 21 }}
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          # Wysyłane są tylko pliki strony – bez plików technicznych repozytorium
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
